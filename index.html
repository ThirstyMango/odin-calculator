<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin - calculator</title>
    <script type="module" defer src="./main.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <h1 class="app__header">Calculator</h1>
      <hr />
      <output class="app__screen">Start calculating</output>
      <hr />
      <div class="app__controls">
        <div class="controls controls--left">
          <button data-btn-type="num" class="controls__btn" value="1">1</button>
          <button data-btn-type="num" class="controls__btn" value="2">2</button>
          <button data-btn-type="num" class="controls__btn" value="3">3</button>
          <button data-btn-type="num" class="controls__btn" value="4">4</button>
          <button data-btn-type="num" class="controls__btn" value="5">5</button>
          <button data-btn-type="num" class="controls__btn" value="6">6</button>
          <button data-btn-type="num" class="controls__btn" value="7">7</button>
          <button data-btn-type="num" class="controls__btn" value="8">8</button>
          <button data-btn-type="num" class="controls__btn" value="9">9</button>
          <button
            data-btn-type="clear"
            class="controls__btn controls__btn--alert"
          >
            C
          </button>
          <button data-btn-type="num" class="controls__btn" value="0">0</button>
          <button data-btn-type="dec" class="controls__btn" value=".">.</button>
        </div>
        <div class="controls controls--right">
          <button
            data-btn-type="operator"
            class="controls__btn controls__btn--special"
            value="+"
          >
            +
          </button>
          <button
            data-btn-type="operator"
            class="controls__btn controls__btn--special"
            value="-"
          >
            -
          </button>
          <button
            data-btn-type="operator"
            class="controls__btn controls__btn--special"
            value="*"
          >
            *
          </button>
          <button
            data-btn-type="operator"
            class="controls__btn controls__btn--special"
            value="/"
          >
            /
          </button>
          <button
            data-btn-type="submit"
            class="controls__btn controls__btn--submit"
          >
            =
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
