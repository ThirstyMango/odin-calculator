<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin - calculator</title>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <div class="app">
      <output class="app__screen">690 / 3</output>
      <div class="app__controls">
        <div class="controls controls--left">
          <button class="controls__btn">1</button>
          <button class="controls__btn">2</button>
          <button class="controls__btn">3</button>
          <button class="controls__btn">4</button>
          <button class="controls__btn">5</button>
          <button class="controls__btn">6</button>
          <button class="controls__btn">7</button>
          <button class="controls__btn">8</button>
          <button class="controls__btn">9</button>
          <button class="controls__btn controls__btn--alert">C</button>
          <button class="controls__btn">0</button>
        </div>
        <div class="controls controls--right">
          <button class="controls__btn controls__btn--special">+</button>
          <button class="controls__btn controls__btn--special">-</button>
          <button class="controls__btn controls__btn--special">*</button>
          <button class="controls__btn controls__btn--special">/</button>
          <button class="controls__btn control__btn--large">=</button>
        </div>
      </div>
    </div>
  </body>
</html>
